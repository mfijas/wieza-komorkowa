name: Build and Deploy
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      # Pinned rather than inherited from the runner image, which drifts as
      # GitHub updates it. 24 is inside the engines.node range declared in
      # package.json (^20.19.0 || ^22.13.0 || >=24) — keep the two in sync.
      - name: Set up Node ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install 📦
        run: npm ci

      - name: Typecheck 🔍
        run: npm run typecheck

      - name: Lint 🧹
        run: npm run lint

      - name: Test 🧪
        run: npm test

      - name: Build 🔧
        run: npm run build

      # Only master publishes to GitHub Pages. Pull requests run the steps
      # above as a verification gate, but must never touch the live site:
      # Pages serves a single site from the gh-pages branch, so any other
      # ref deploying here would overwrite production.
      - name: Deploy 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
