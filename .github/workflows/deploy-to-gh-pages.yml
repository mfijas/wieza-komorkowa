name: Build and Deploy
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: write
jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v3

      - name: Install and Build 🔧
        run: |
          npm ci
          npm run build

      # Only master publishes to GitHub Pages. Pull requests run the build
      # above as a verification gate, but must never touch the live site:
      # Pages serves a single site from the gh-pages branch, so any other
      # ref deploying here would overwrite production.
      - name: Deploy 🚀
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
